<!DOCTYPE html>
<html>
<head>
<title>Transactions - MoneyTracker</title>

<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favi.ico') }}">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
background:#f5f7fb;
min-height:100vh;
display:flex;
flex-direction:column;
}

/* navbar */

.navbar{
background:white;
padding:16px 40px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #e5e7eb;
}

.logo{
font-size:20px;
font-weight:600;
color:#2563eb;
}

/* container */

.container{
max-width:900px;
margin:40px auto;
padding:20px;
}

/* heading */

h2{
margin-bottom:20px;
color:#1f2937;
}

/* table */

table{
width:100%;
border-collapse:collapse;
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 8px 20px rgba(0,0,0,0.05);
}

th{
background:#2563eb;
color:white;
padding:14px;
text-align:left;
font-size:14px;
}

td{
padding:14px;
border-bottom:1px solid #e5e7eb;
font-size:14px;
}

/* row hover */

tr:hover{
background:#f9fafb;
}

/* type colors */

.income{
color:#16a34a;
font-weight:500;
}

.expense{
color:#dc2626;
font-weight:500;
}

/* home button */

.home{
margin-top:20px;
}

.home a{
background:#2563eb;
color:white;
padding:10px 18px;
text-decoration:none;
border-radius:6px;
font-size:14px;
}

/* footer */

footer{
margin-top:auto;
text-align:center;
padding:12px;
font-size:13px;
color:#6b7280;
border-top:1px solid #e5e7eb;
background:#f5f7fb;
}

footer span{
font-weight:500;
color:#1f2937;
}

</style>
</head>

<body>

<div class="navbar">
<div class="logo">MoneyTracker</div>
</div>

<div class="container">

<h2>Transaction History</h2>

<table>

<tr>
<th>Date</th>
<th>Type</th>
<th>Source</th>
<th>Amount</th>
</tr>

{% for t in transactions %}
<tr>
<td>{{ t.date }}</td>
<td>{{ t.type }}</td>
<td>{{ t.source }}</td>
<td>₹ {{ t.amount }}</td>
</tr>
{% endfor %}

</table>

<div class="home">
<a href="/home">Back to Dashboard</a>
</div>

</div>

<footer>
© 2025 Created by <span>Jeet Thakkar</span>
</footer>

</body>
</html>
