<!DOCTYPE html>
<html>
<head>
<title>Add Expense - MoneyTracker</title>

<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favi.ico') }}">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
background:#f5f7fb;
min-height:100vh;
display:flex;
flex-direction:column;
}

/* navbar */

.navbar{
background:white;
padding:16px 40px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #e5e7eb;
}

.logo{
font-size:20px;
font-weight:600;
color:#2563eb;
}

/* center container */

.container{
flex:1;
display:flex;
justify-content:center;
align-items:center;
}

/* form card */

.card{
background:white;
padding:35px;
width:420px;
border-radius:12px;
border:1px solid #e5e7eb;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.card h2{
margin-bottom:20px;
color:#1f2937;
}

/* labels */

label{
font-size:14px;
color:#374151;
}

/* inputs */

input{
width:100%;
padding:12px;
margin-top:6px;
margin-bottom:16px;
border:1px solid #d1d5db;
border-radius:8px;
font-size:14px;
}

input:focus{
outline:none;
border-color:#2563eb;
box-shadow:0 0 0 3px rgba(37,99,235,0.1);
}

/* buttons */

.buttons{
display:flex;
justify-content:space-between;
margin-top:10px;
}

button{
padding:10px 18px;
border:none;
border-radius:6px;
cursor:pointer;
font-size:14px;
}

/* expense button */

.submit-btn{
background:#dc2626;
color:white;
}

.submit-btn:hover{
background:#b91c1c;
}

/* home button */

.home-btn{
background:#2563eb;
color:white;
text-decoration:none;
display:inline-block;
padding:10px 18px;
border-radius:6px;
}

/* footer */

footer{
text-align:center;
padding:12px;
font-size:13px;
color:#6b7280;
border-top:1px solid #e5e7eb;
background:#f5f7fb;
}

footer span{
font-weight:500;
color:#1f2937;
}

</style>
</head>

<body>

<div class="navbar">
<div class="logo">MoneyTracker</div>
</div>

<div class="container">

<div class="card">

<h2>Add Expense</h2>

<form action="/addexpense" method="post">

<label>Expense Amount</label>
<input type="number" name="amountexpense" required>

<label>Expense Category</label>
<input type="text" name="expensesource" required>

<label>Date</label>
<input type="date" name="dateexpense" required>

<input type="hidden" name="userid" value="{{ userid }}">

<div class="buttons">

<a href="http://127.0.0.1:1606/home" class="home-btn">
Home
</a>

<button type="submit" class="submit-btn">
Add Expense
</button>

</div>

</form>

</div>

</div>

<footer>
© 2025 Created by <span>Jeet Thakkar</span>
</footer>

</body>
</html>
