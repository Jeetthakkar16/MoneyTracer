<!DOCTYPE html>
<html>
<head>
<title>MoneyTracker Dashboard</title>

<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favi.ico') }}">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
background:#f5f7fb;
min-height:100vh;
display:flex;
flex-direction:column;
}

/* navbar */

.navbar{
background:white;
padding:16px 40px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #e5e7eb;
}

.logo{
font-size:20px;
font-weight:600;
color:#2563eb;
}

.user{
font-size:14px;
color:#374151;
}

/* main container */

.container{
max-width:900px;
margin:40px auto;
padding:20px;
}

/* balance card */

.balance-card{
background:#2563eb;
color:white;
padding:30px;
border-radius:12px;
margin-bottom:30px;
box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

.balance-card h3{
font-size:16px;
margin-bottom:10px;
font-weight:500;
}

.balance{
font-size:32px;
font-weight:600;
}

/* chart card */

.chart-card{
background:white;
padding:25px;
border-radius:12px;
border:1px solid #e5e7eb;
box-shadow:0 8px 20px rgba(0,0,0,0.05);
margin-bottom:30px;
}

.chart-card h3{
margin-bottom:20px;
color:#1f2937;
}

/* action grid */

.actions{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

/* cards */

.card{
background:white;
padding:25px;
border-radius:12px;
border:1px solid #e5e7eb;
text-align:center;
transition:0.2s;
cursor:pointer;
}

.card:hover{
transform:translateY(-3px);
box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

.card h4{
margin-bottom:8px;
color:#1f2937;
}

.card p{
font-size:14px;
color:#6b7280;
}

/* buttons */

.card button{
margin-top:12px;
padding:10px 16px;
border:none;
border-radius:6px;
font-size:14px;
cursor:pointer;
}

/* specific buttons */

.income-btn{
background:#16a34a;
color:white;
}

.expense-btn{
background:#dc2626;
color:white;
}

.transaction-btn{
background:#2563eb;
color:white;
}

/* logout */

.logout{
margin-top:30px;
text-align:right;
}

.logout button{
background:#111827;
color:white;
padding:10px 16px;
border:none;
border-radius:6px;
cursor:pointer;
}

/* footer */

footer{
position:fixed;
bottom:0;
left:0;
width:100%;
text-align:center;
padding:12px 0;
font-size:13px;
color:#6b7280;
background:#f5f7fb;
border-top:1px solid #e5e7eb;
z-index:1000;
}

footer span{
font-weight:500;
color:#1f2937;
}

.summary{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-bottom:30px;
}

.box{
background:white;
padding:20px;
border-radius:10px;
border:1px solid #e5e7eb;
}

.income p{
color:#16a34a;
font-weight:600;
}

.expense p{
color:#dc2626;
font-weight:600;
}

</style>
</head>

<body>

<div class="navbar">
<div class="logo">MoneyTracker</div>
<div class="user">Welcome {{ username }}</div>
</div>

<div class="container">

<div class="balance-card">
<h3>Your Current Balance</h3>
<div class="balance">₹ {{ balance }}</div>
</div>

<div class="chart-card">
<h3>Income vs Expense Overview</h3>
<canvas id="financeChart"></canvas>
</div>

<div class="actions">

<a href="/addincome" style="text-decoration:none;">
<div class="card">
<h4>Add Income</h4>
<p>Record money you received</p>
<div class="income-btn">Add Income</div>
</div>
</a>

<a href="/addexpense" style="text-decoration:none;">
<div class="card">
<h4>Add Expense</h4>
<p>Track money you spent</p>
<div class="expense-btn">Add Expense</div>
</div>
</a>

<a href="/viewtransactions" style="text-decoration:none;">
<div class="card">
<h4>Transactions</h4>
<p>View income & expense history</p>
<div class="transaction-btn">View</div>
</div>
</a>

</div>

</div>

<footer>
© 2025 Created by <span>Jeet Thakkar</span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

const ctx = document.getElementById('financeChart');

new Chart(ctx, {

type:'bar',

data:{
labels:['Income','Expense'],

datasets:[{
label:'Money Flow',

data:[{{ income_total }}, {{ expense_total }}],

backgroundColor:[
'#16a34a',
'#dc2626'
],

borderRadius:6
}]
},

options:{
plugins:{
legend:{
display:false
}
},

scales:{
y:{
beginAtZero:true
}
}
}

});

</script>

</body>
</html>
